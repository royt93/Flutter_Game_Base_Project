# Khai báo tag dùng trong test (tránh cảnh báo "undefined tag").
# 'slow': test integration điều khiển app thật trên device, chạy real-time rất chậm
# (vào GameScreen + vòng đời ~5-8 phút/case). Bộ test thường:
#   flutter test --exclude-tags slow
# Nightly / device-farm chạy đầy đủ (kể cả slow):
#   flutter test integration_test/app_test.dart -d <device>
tags:
  slow:
    description: Integration test chạy real-time trên device thật, rất chậm — dành cho nightly.
