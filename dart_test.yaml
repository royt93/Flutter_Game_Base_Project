# Khai báo tag dùng trong test (tránh cảnh báo "undefined tag").
# 'slow': dành cho test integration điều khiển app thật trên device, hoặc
# shell ra 1 process chậm thật (vd `flutter create`), chạy real-time chậm
# hơn nhiều so với unit/widget test — vd
# test/tool/create_consumer_app_e2e_test.dart (FEAT-73). Bộ test thường:
#   flutter test --exclude-tags slow
tags:
  slow:
    description: Integration test chạy real-time trên device thật, rất chậm — dành cho nightly.
