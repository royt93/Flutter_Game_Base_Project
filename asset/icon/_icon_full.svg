    <polygon points="362,360 662,360 616,460 408,460" fill="url(#gemLight2)" opacity="0.85"/>
    <g stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9" fill="none" stroke-linejoin="round">
      <polygon points="362,360 662,360 744,460 512,780 280,460"/>
      <line x1="408" y1="460" x2="616" y2="460"/>
      <line x1="362" y1="360" x2="408" y2="460"/>
      <line x1="662" y1="360" x2="616" y2="460"/>
      <line x1="280" y1="460" x2="408" y2="460"/>
      <line x1="744" y1="460" x2="616" y2="460"/>
      <line x1="408" y1="460" x2="512" y2="780"/>
      <line x1="616" y1="460" x2="512" y2="780"/>
