<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#BC4BFF"/>
    </linearGradient>
    <linearGradient id="gemLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Viên kim cương neon -->
  <g filter="url(#glow)">
    <!-- glow nền theo màu gem -->
    <polygon points="350,330 674,330 764,440 512,800 260,440"
             fill="url(#gem)" opacity="0.55"/>
    <!-- thân gem -->
    <polygon points="350,330 674,330 764,440 512,800 260,440"
             fill="url(#gem)"/>
    <!-- mặt bàn sáng -->
    <polygon points="350,330 674,330 624,440 400,440"
             fill="url(#gemLight)" opacity="0.85"/>
    <!-- các đường facet -->
    <g stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.9" fill="none" stroke-linejoin="round">
      <polygon points="350,330 674,330 764,440 512,800 260,440"/>
      <line x1="400" y1="440" x2="624" y2="440"/>
      <line x1="350" y1="330" x2="400" y2="440"/>
      <line x1="674" y1="330" x2="624" y2="440"/>
      <line x1="260" y1="440" x2="400" y2="440"/>
      <line x1="764" y1="440" x2="624" y2="440"/>
      <line x1="400" y1="440" x2="512" y2="800"/>
      <line x1="624" y1="440" x2="512" y2="800"/>
    </g>
  </g>
</svg>
