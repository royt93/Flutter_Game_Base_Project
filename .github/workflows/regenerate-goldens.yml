name: Regenerate goldens (Linux CI-accurate)

# Golden PNGs under test/widget/goldens/ were apparently last generated on
# macOS (different font hinting/anti-aliasing than Linux) and have been
# silently failing CI's "Test host" step — not caught until a PR actually
# ran CI for real. This regenerates them on the exact ubuntu-latest +
# pinned Flutter version CI itself runs on and uploads them as the
# `regenerated-goldens` artifact (BUG-105: this repo blocks Actions from
# opening PRs, and create-pull-request failed with a duplicate auth header);
# download it, copy only the PNGs that should change, and commit. Manual trigger only (not on a
# schedule) — run it after a real widget-appearance change, or whenever
# CI's "Test host" starts failing goldens again.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --update-goldens test/widget/goldens/

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: test/widget/goldens/goldens/*.png
          if-no-files-found: error
          retention-days: 7
