name: CI

# Cổng nhanh cho mọi push/PR: analyze + toàn bộ test host (BỎ QUA nhóm 'slow' của
# integration vì cần thiết bị thật). Chưa có workflow nightly.yml — hiện chưa
# test nào gắn tag 'slow' (xem dart_test.yaml) nên chưa cần; tạo nightly.yml
# khi có integration test 'slow' đầu tiên cần chạy định kỳ trên thiết bị thật.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Public API compatibility gate
        run: dart run tool/api_compatibility.dart check
      - name: Analyze (0 issue bắt buộc)
        run: flutter analyze
      - name: Test host (loại nhóm slow cần device)
        run: flutter test --exclude-tags slow
      - name: Publish artifact hygiene gate (ENH-57, 0 warning bắt buộc)
        run: dart pub publish --dry-run
      - run: flutter pub get
        working-directory: example
      - name: Analyze example (0 issue bắt buộc)
        run: flutter analyze
        working-directory: example
      - name: Test example host (loại nhóm slow cần device)
        run: flutter test --exclude-tags slow
        working-directory: example

  # Chỉ chạy khi lib/, tool/, pubspec.yaml, asset/shaders root, hoặc
  # example/assets (+ example/pubspec.yaml) đổi (paths-filter, BUG-99) —
  # dùng chung concurrency group ở trên nên push dồn dập tự coalesce,
  # không tốn thêm run thừa.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          filters: |
            relevant:
              - 'lib/**'
              - 'tool/**'
              - 'pubspec.yaml'
              - 'asset/**'
              - 'shaders/**'
              - 'example/assets/**'
              - 'example/pubspec.yaml'
              - 'example/pubspec.lock'
      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
      - name: Accessibility audit gate
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/accessibility_audit_check.dart
      - name: Dependency SBOM/security gate (package)
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/dependency_sbom_check.dart --suppressions=tool/dependency_sbom_suppressions.json
      - name: Dependency SBOM/security gate (example)
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/dependency_sbom_check.dart --root=example --lockfile=example/pubspec.lock --suppressions=tool/dependency_sbom_suppressions.json
      - name: Asset license manifest gate (package)
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/asset_license_check.dart
      - name: Asset license manifest gate (example)
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/asset_license_check.dart --root=example --asset-roots=assets --manifest=assets/LICENSES.json
      - name: Performance budget gate
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/performance_budget_check.dart check
      - name: Deprecation removal-schedule gate
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run tool/deprecation_check.dart

  # Sinh app consumer thật từ tool/create_consumer_app.dart (path dependency
  # vào PR này), rồi analyze + test + build APK + chạy integration test trên
  # emulator. Bắt lỗi chỉ lộ ở app tiêu thụ package (vd 0.4.0: font chưa
  # qualify theo package, cấu hình native Android thiếu).
  consumer-smoke:
    runs-on: ubuntu-latest
    # Một lần chạy bình thường ~8 phút (emulator ~3 phút); lần treo emulator
    # từng chiếm 36+ phút (mặc định GitHub là 6 giờ). Job-level chặn mọi bước,
    # step-level bên dưới cắt riêng emulator để lỗi hiện đúng chỗ.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          filters: |
            relevant:
              - 'lib/**'
              - 'tool/create_consumer_app.dart'
              - 'pubspec.yaml'
              - 'asset/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 17
      - name: Generate consumer app (path dependency on this checkout)
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          flutter pub get
          dart run tool/create_consumer_app.dart --name=ci_smoke --output="$RUNNER_TEMP" --kitPath="$GITHUB_WORKSPACE"
      - name: Analyze + test generated app
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ runner.temp }}/ci_smoke
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Pre-install NDK
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          timeout 300 "$sdkmanager" --install "ndk;27.0.12077973" || timeout 300 "$sdkmanager" --install "ndk;27.0.12077973"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*27\.0\.12077973[[:space:]]*$' "$ANDROID_HOME/ndk/27.0.12077973/source.properties"
          test -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      - name: Build debug APK
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ runner.temp }}/ci_smoke
        run: flutter build apk --debug
      - name: Enable KVM
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test on emulator
        if: steps.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: ${{ runner.temp }}/ci_smoke
          script: |
            bash -c 'capture_emulator_diagnostics() { echo "--- adb devices ---"; timeout 20 adb devices -l || true; echo "--- boot properties ---"; timeout 20 adb shell getprop sys.boot_completed || true; timeout 20 adb shell getprop init.svc.bootanim || true; echo "--- emulator/adb processes ---"; ps -eo pid,comm,args | awk '\''$2 ~ /^(emulator|qemu-system|adb)$/ { print }'\'' || true; echo "--- emulator log files ---"; find "$ANDROID_USER_HOME" -type f \( -name "emulator*.log" -o -name "adb*.log" \) -print 2>/dev/null | head -20 || true; echo "--- recent emulator logcat ---"; timeout 20 adb logcat -d -t 300 2>&1 | tail -300 || true; }; monitor_emulator() { n=0; while true; do sleep 60; n=$((n+1)); echo "--- emulator watcher $(date -u +%FT%TZ) ---"; if [ -f /tmp/vm_trace.log ]; then echo "--- vm trace (last 15) ---"; tail -15 /tmp/vm_trace.log; fi; if [ "$n" -eq 3 ] || [ "$n" -eq 9 ]; then echo "--- app native state ---"; apid=$(timeout 10 adb shell pidof com.example.ci_smoke 2>/dev/null | tr -d "\r"); echo "app pid: ${apid:-none}"; if [ -n "$apid" ]; then timeout 20 adb shell "for t in /proc/$apid/task/*; do echo \"\$(cat \$t/comm 2>/dev/null) state=\$(awk '{print \$3}' \$t/stat 2>/dev/null) wchan=\$(cat \$t/wchan 2>/dev/null)\"; done" 2>&1 | head -80 || true; timeout 15 adb shell dumpsys gfxinfo com.example.ci_smoke 2>&1 | grep -E "Total frames rendered|Janky frames|Draw|Process" | head -6 || true; timeout 15 adb shell dumpsys SurfaceFlinger --latency 2>&1 | head -3 || true; fi; fi; if [ "$n" -eq 6 ] || [ "$n" -eq 12 ]; then echo "--- host flutter test state ---"; ps -eo pid,etime,stat,args | grep -E "flutter_tools|flutter test|dartvm|dds" | grep -v grep | cut -c1-200 || true; timeout 10 ss -tnp 2>/dev/null | grep "127.0.0.1" | head -20 || true; timeout 10 adb forward --list || true; echo "--- vm service probe ---"; uri=$(timeout 10 adb logcat -d -s flutter:V 2>&1 | grep -o "http://127.0.0.1:[0-9]*/[^ ]*" | tail -1); echo "device vm service: ${uri:-none}"; if [ -n "$uri" ]; then port=${uri#http://127.0.0.1:}; port=${port%%/*}; path=/${uri#http://127.0.0.1:*/}; hostport=$(timeout 10 adb forward tcp:0 tcp:$port); echo "forwarded host port: $hostport"; timeout 60 dart "$GITHUB_WORKSPACE/.github/scripts/vm_probe.dart" "http://127.0.0.1:$hostport$path" || true; fi; fi; timeout 10 adb devices -l || true; timeout 10 adb shell getprop sys.boot_completed || true; timeout 10 adb shell ps -A | grep -E "flutter|ci_smoke|instrumentation" || true; timeout 10 adb logcat -d -t 200 2>&1 | grep -Ei "fatal exception|AndroidRuntime|flutter|vm service|instrumentation" | tail -30 || true; echo "--- app flutter logcat ---"; timeout 10 adb logcat -d -s flutter:V 2>&1 | tail -20 || true; done; }; attach_tracer() { i=0; while [ "$i" -lt 240 ]; do i=$((i+1)); turi=$(adb logcat -d -s flutter:V 2>/dev/null | grep -o "http://127.0.0.1:[0-9]*/[^ ]*" | tail -1); if [ -n "$turi" ]; then tport=${turi#http://127.0.0.1:}; tport=${tport%%/*}; tpath=/${turi#http://127.0.0.1:*/}; thost=$(adb forward tcp:0 tcp:$tport); if [ -n "$thost" ]; then echo "vm tracer attach $(date -u +%FT%TZ) after ${i} polls, host port $thost"; dart "$GITHUB_WORKSPACE/.github/scripts/vm_trace.dart" "http://127.0.0.1:$thost$tpath" 1500 > /tmp/vm_trace.log 2>&1; return; fi; fi; sleep 2; done; }; attach_tracer & tracer=$!; monitor_emulator & watcher=$!; cleanup() { kill "$watcher" "$tracer" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true; capture_emulator_diagnostics; }; trap cleanup EXIT; flutter test --verbose integration_test/app_boot_test.dart'
