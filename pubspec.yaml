name: roy_casual_kit
description: "A casual/idle-game SDK for Flutter (GetX + Flame): storage, i18n, audio, haptics, reminders, economy/progression, live-ops tooling, and a candy-styled widget kit."
version: 0.2.3
homepage: https://github.com/royt93/Flutter_Game_Base_Project
repository: https://github.com/royt93/Flutter_Game_Base_Project
issue_tracker: https://github.com/royt93/Flutter_Game_Base_Project/issues
topics:
  - widgets
  - game
  - ui
  - flame
  - casual-game

screenshots:
  - description: 'Home screen of the example app, light theme.'
    path: screenshots/home_light.png
  - description: 'Home screen, neon-dark theme — same NeonTheme tokens, no call-site changes.'
    path: screenshots/home_dark.png
  - description: 'Settings screen: locale, audio mute, dark mode, and color-blind-safe toggles.'
    path: screenshots/settings_light.png
  - description: 'Settings screen in dark mode.'
    path: screenshots/settings_dark.png
  - description: 'Widget kit showcase: buttons and interactive controls, light theme.'
    path: screenshots/widget_kit_buttons_light.png
  - description: 'Widget kit showcase: buttons and interactive controls, dark theme.'
    path: screenshots/widget_kit_buttons.png
  - description: 'Widget kit showcase: badges, sound toggle, and other interactive widgets.'
    path: screenshots/widget_kit_interactive.png
  - description: 'Widget kit showcase: tooltips, bottom sheet, confirm dialog, and network banner.'
    path: screenshots/widget_kit_overlays.png
  - description: 'Flame game shell embedded in a normal Flutter widget tree, with a world-tracked HUD label.'
    path: screenshots/game_demo.png

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.6
  get: ^4.7.3
  flame: ^1.35.1
  shared_preferences: ^2.5.5
  flame_audio: ^2.11.14
  share_plus: ^12.0.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/audio/

  fonts:
    - family: Baloo2
      fonts:
        - asset: asset/fonts/Baloo2.ttf

  shaders:
    - shaders/neon_glow.frag
    - shaders/aurora_bg.frag
